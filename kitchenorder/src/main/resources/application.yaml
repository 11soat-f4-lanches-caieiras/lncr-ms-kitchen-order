spring:
  application:
    name: lncr-ms-kitchen-order
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: "${POSTGRES_URL}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
server:
  port: 8080
lncr:
  internal-url: "${LNCR_INTERNAL_URL:http://localhost:8080}"
  external-url: "${LNCR_EXTERNAL_URL:http://localhost:8080}"
  integration:
    customer-orders-url: "${lncr.internal-url}/customerOrders"
    food-items-url: "${lncr.internal-url}/foodItems"
    food-items-list-url: "${lncr.internal-url}/foodItems/listIds"
    notification-url: "${lncr.internal-url}/notifications"

  kitchen-order:
    location-prefix: "${lncr.external-url}/kitchenOrders"



